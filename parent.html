<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#082e61"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="apple-touch-icon" href="/icon-192.png"><title>태권도 출석관리 · 학부모</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f9;font-family:"Malgun Gothic",sans-serif;color:#172a40}main{max-width:540px;margin:32px auto;padding:0 15px}h1{text-align:center;color:#082e61;font-size:23px}p{line-height:1.6}.card{background:#fff;border-radius:15px;padding:22px;margin:16px 0;box-shadow:0 5px 24px #1c3e6312}label{display:block;margin:12px 0 8px;font-weight:bold}input{width:100%;padding:15px;font-size:18px;border:1px solid #c9d6e6;border-radius:9px}button{background:#082e61;color:#fff;border:0;border-radius:9px;padding:14px 18px;font-size:16px;cursor:pointer;width:100%;margin-top:12px}button:disabled{opacity:.5}.muted{color:#637589;font-size:13px}.student{border-top:1px solid #e0e8f1;padding:15px 0}.calendar-head{display:flex;align-items:center;gap:8px;margin:16px 0 10px}.calendar-head button{width:auto;flex:0 0 auto;margin:0;padding:9px 10px;font-size:13px}.calendar-head strong{flex:1;text-align:center;font-size:15px}.calendar-week,.calendar-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.calendar-week span{text-align:center;font-size:12px;padding:7px 0;color:#637589}.calendar-week span:first-child{color:#bc4051}.calendar-week span:last-child{color:#2966ad}.calendar-day{border:1px solid #e1e8f1;border-radius:8px;min-height:55px;padding:5px 2px;text-align:center;font-size:12px;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:flex-start}.calendar-day.blank{border:0}.calendar-day.today{outline:2px solid #3278c9}.calendar-day.checked{background:#e9f6ee;border-color:#a8d8b9}.calendar-day.departed{background:#e8f0ff;border-color:#a9c6e8}.calendar-day .mark{font-size:10px;font-weight:700}.calendar-note{font-size:12px;color:#637589;margin:8px 0 12px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:10px 6px;border-bottom:1px solid #e6ecf3;text-align:center}img{width:100%;max-height:350px;object-fit:contain;border-radius:9px;background:#eef2f7}#msg,#pushMsg{min-height:24px;color:#174b83}.hide{display:none}.badge{font-weight:bold;color:#176045}</style></head><body><main><h1>태권도 출석관리</h1><p style="text-align:center" class="muted" id="intro">도장에서 안내받은 학부모 공용 주소입니다.</p><section class="card" id="phoneCard"><form id="form"><label for="phone">학부모 휴대전화번호</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="010-1234-5678" required><p class="muted">도장에 등록된 번호를 입력하세요. 출석번호는 학생이 출석체크기에 입력하는 번호입니다.</p><button id="lookup" type="submit">자녀 출석 확인</button></form><p id="msg" role="status"></p></section><section id="results" class="card hide"><h2 id="dojoName"></h2><button type="button" id="refreshRecords" style="background:#e8f0fa;color:#173c6a;margin:0 0 10px">출석정보 새로고침</button><p id="refreshStatus" class="muted" role="status"></p><div id="children"></div><button type="button" id="installApp">휴대폰 홈 화면에 앱 설치하기</button><p id="installMsg" class="muted" role="status"></p><button type="button" id="resetDevice" class="alt" style="background:#e8f0fc;color:#103d75">이 휴대폰의 연결 해제 / 번호 변경</button><button type="button" id="pushOn">이 휴대폰에서 출석·귀가 알림 켜기</button><p id="pushMsg" role="status"></p><p class="muted">휴대전화번호만으로 조회하는 간편 방식입니다. 번호를 아는 사람도 조회할 수 있으므로 공용 기기에서는 사용 후 입력 내용을 지워 주세요.</p></section></main><script>
const PROJECT='https://ixuxlblfkoccmwqxsjbw.supabase.co',KEY='sb_publishable_lmwJJaHfZzE5hXnZnF49oA__F7JpDZ8';const requestedDojo=new URLSearchParams(location.search).get('dojo');const savedDojo=localStorage.getItem('tkd:lastDojo');const dojo=requestedDojo||savedDojo;const $=id=>document.getElementById(id);let accessToken=null,publicKey=null;let deferredInstall=null;const deviceKey='tkd:parentDevice:'+dojo;const validDojo=/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(dojo||'');
function fmt(v){return v?new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(v)):'—'}
async function call(name,payload){const res=await fetch(PROJECT+'/functions/v1/'+name,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify(payload)});const data=await res.json().catch(()=>({}));if(!res.ok||!data.success)throw Error(data.message||'서버 연결 오류');return data}
let currentData=null,chosenMonth=null;
function kstToday(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function currentMonth(){return kstToday().slice(0,7)}
function monthShift(month,delta){const [y,m]=month.split('-').map(Number);const d=new Date(Date.UTC(y,m-1+delta,1));return d.toISOString().slice(0,7)}
function render(data){
 currentData=data;chosenMonth=chosenMonth||currentMonth();
 $('dojoName').textContent=data.dojo_name||'우리 도장';$('children').replaceChildren();
 for(const child of data.children||[]){
  const sec=document.createElement('section');sec.className='student';const title=document.createElement('h3');title.textContent=child.name+' 학생';sec.append(title);
  const records=child.records||[];const recent=document.createElement('p');recent.className='badge';recent.textContent=records.length?'최근 출석 '+records[0].attendance_date+' '+fmt(records[0].checked_at)+' · 귀가 '+fmt(records[0].departed_at):'출석 기록 없음';sec.append(recent);
  if(child.photo_url){const pic=document.createElement('img');pic.src=child.photo_url;pic.alt=child.name+' 최근 출석사진';pic.addEventListener('click',()=>window.open(pic.src,'_blank','noopener'));sec.append(pic)}
  const head=document.createElement('div');head.className='calendar-head';const prev=document.createElement('button');prev.type='button';prev.textContent='◀ 이전 달';const label=document.createElement('strong');label.textContent=chosenMonth.replace('-','년 ')+'월';const next=document.createElement('button');next.type='button';next.textContent='다음 달 ▶';next.disabled=chosenMonth>=currentMonth();prev.onclick=()=>{chosenMonth=monthShift(chosenMonth,-1);render(currentData)};next.onclick=()=>{chosenMonth=monthShift(chosenMonth,1);render(currentData)};head.append(prev,label,next);sec.append(head);
  const weekdays=document.createElement('div');weekdays.className='calendar-week';for(const w of ['일','월','화','수','목','금','토']){const x=document.createElement('span');x.textContent=w;weekdays.append(x)}sec.append(weekdays);
  const grid=document.createElement('div');grid.className='calendar-days';const [y,m]=chosenMonth.split('-').map(Number);const offset=new Date(Date.UTC(y,m-1,1)).getUTCDay(),days=new Date(Date.UTC(y,m,0)).getUTCDate();const byDay=new Map(records.map(r=>[r.attendance_date,r]));
  for(let i=0;i<offset;i++){const blank=document.createElement('div');blank.className='calendar-day blank';grid.append(blank)}
  for(let d=1;d<=days;d++){const date=chosenMonth+'-'+String(d).padStart(2,'0'),r=byDay.get(date);const cell=document.createElement('div');cell.className='calendar-day'+(r?(r.departed_at?' departed':' checked'):'')+(date===kstToday()?' today':'');const num=document.createElement('span');num.textContent=d;cell.append(num);if(r){const mark=document.createElement('span');mark.className='mark';mark.textContent=r.departed_at?'귀가 완료':'출석 완료';cell.append(mark);cell.title='출석 '+fmt(r.checked_at)+' / 귀가 '+fmt(r.departed_at)}grid.append(cell)}sec.append(grid);
  const detail=document.createElement('p');detail.className='calendar-note';detail.setAttribute('aria-live','polite');detail.textContent='날짜를 누르면 출석·귀가 시간을 확인할 수 있습니다.';sec.append(detail);for(const cell of grid.children){if(!cell.classList.contains('blank')){cell.setAttribute('role','button');cell.setAttribute('tabindex','0');const date=chosenMonth+'-'+String(cell.firstChild.textContent).padStart(2,'0');const record=byDay.get(date);const show=()=>{detail.textContent=date+' · '+(record?'출석 '+fmt(record.checked_at)+' / 귀가 '+fmt(record.departed_at):'출석 기록 없음')};cell.addEventListener('click',show);cell.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show()}})}}const note=document.createElement('p');note.className='calendar-note';note.textContent='초록: 출석 · 파랑: 귀가 완료 · 테두리: 오늘';sec.append(note);
  $('children').append(sec)
 }
 $('results').classList.remove('hide')
}
$('form').addEventListener('submit',async e=>{e.preventDefault();const phone=$('phone').value.replace(/\D/g,'');if(!/^01[016789][0-9]{7,8}$/.test(phone)){ $('msg').textContent='휴대전화번호를 확인해 주세요.';return}if(!/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(dojo||'')){$('msg').textContent='도장 공용 주소를 확인해 주세요.';return} $('lookup').disabled=true;$('msg').textContent='조회 중입니다.';try{const data=await call('platform-parent-phone',{dojo_id:dojo,phone});accessToken=data.access_token;publicKey=data.vapid_public_key;render(data);$('msg').textContent='조회되었습니다.';if(validDojo)localStorage.setItem('tkd:lastDojo',dojo);await linkDevice(data.access_token);$('phone').value='';}catch(err){accessToken=null;$('results').classList.add('hide');$('msg').textContent=err.message||'조회 실패'}finally{$('lookup').disabled=false}});

async function linkDevice(shortToken){
 try{
  const data=await call('platform-parent-device',{action:'link',dojo_id:dojo,access_token:shortToken});
  localStorage.setItem(deviceKey,data.device_token);accessToken=data.device_token;
  $('phoneCard').classList.add('hide');$('msg').textContent='';
 }catch(err){$('msg').textContent='조회되었습니다. 자동 연결 저장 실패: '+err.message;}
}
async function openSaved(){
 if(!validDojo){$('msg').textContent='도장에서 받은 학부모 전용 주소로 다시 접속해 주세요.';return}
 const token=localStorage.getItem(deviceKey);if(!token)return;
 $('msg').textContent='자녀 출석정보를 불러오는 중입니다.';
 try{
  const data=await call('platform-parent-device',{action:'view',dojo_id:dojo,device_token:token});
  accessToken=token;publicKey=data.vapid_public_key;render(data);lastRecordsRefresh=Date.now();
  $('phoneCard').classList.add('hide');$('msg').textContent='';
 }catch(err){
  localStorage.removeItem(deviceKey);$('phoneCard').classList.remove('hide');$('results').classList.add('hide');
  $('msg').textContent='연결 기간이 만료되었거나 해제되었습니다. 전화번호를 다시 입력해 주세요.';
 }
}
let lastRecordsRefresh=0,refreshingRecords=false;
async function refreshRecords(silent=false){
 if(refreshingRecords||!validDojo||!accessToken||$('results').classList.contains('hide'))return;
 const token=localStorage.getItem(deviceKey);
 if(!token)return;
 refreshingRecords=true;
 if(!silent)$('refreshStatus').textContent='최신 출석정보 확인 중...';
 try{const data=await call('platform-parent-device',{action:'view',dojo_id:dojo,device_token:token});publicKey=data.vapid_public_key;render(data);lastRecordsRefresh=Date.now();$('refreshStatus').textContent='최신 출석정보로 갱신했습니다.'}
 catch(e){$('refreshStatus').textContent='새로고침 실패: '+e.message+' (기존 화면은 유지됩니다)'}
 finally{refreshingRecords=false}
}
$('refreshRecords').addEventListener('click',()=>refreshRecords());
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastRecordsRefresh>30000)refreshRecords(true)});
window.addEventListener('pageshow',()=>{if(Date.now()-lastRecordsRefresh>30000)refreshRecords(true)});
$('resetDevice').onclick=async()=>{
 if(!confirm('이 휴대폰의 학부모 연결을 해제하고 전화번호를 다시 입력하시겠습니까?'))return;
 const token=localStorage.getItem(deviceKey);
 localStorage.removeItem(deviceKey);accessToken=null;publicKey=null;
 $('results').classList.add('hide');$('phoneCard').classList.remove('hide');$('phone').value='';$('msg').textContent='전화번호를 입력해 주세요.';
 if(token)call('platform-parent-device',{action:'revoke',dojo_id:dojo,device_token:token}).catch(()=>{});
};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});
$('installApp').onclick=async()=>{
 const ua=navigator.userAgent||'';const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
 if(standalone){$('installMsg').textContent='이미 홈 화면에서 실행 중입니다.';return}
 if(deferredInstall){
  deferredInstall.prompt();const choice=await deferredInstall.userChoice;deferredInstall=null;
  $('installMsg').textContent=choice?.outcome==='accepted'?'설치가 진행됩니다.':'브라우저 메뉴에서 홈 화면에 추가할 수 있습니다.';return;
 }
 if(/iPad|iPhone|iPod/i.test(ua)){
  $('installMsg').textContent='아이폰: Safari에서 이 주소를 연 뒤 공유(□↑) → 홈 화면에 추가 → 추가를 누르세요. 알림은 설치된 앱에서 허용해 주세요.';
 }else if(/SamsungBrowser/i.test(ua)){
  $('installMsg').textContent='삼성 인터넷: 하단 메뉴(≡) → 현재 페이지 추가 → 홈 화면을 선택하세요.';
 }else{
  $('installMsg').textContent='브라우저 메뉴(⋮) → 앱 설치 또는 홈 화면에 추가를 선택하세요.';
 }
};
window.addEventListener('appinstalled',()=>{$('installMsg').textContent='앱이 설치되었습니다.'});
openSaved();
function b64bytes(str){const pad='='.repeat((4-str.length%4)%4);const raw=atob((str+pad).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(raw,c=>c.charCodeAt(0))}
$('pushOn').onclick=async()=>{
 let stage='① 사전 확인';const btn=$('pushOn');btn.disabled=true;
 const report=t=>{$('pushMsg').textContent=t};
 const limit=(promise,ms)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(Error('응답 시간 초과 ('+Math.round(ms/1000)+'초)')),ms))]);
 try{
  report(stage+' 진행 중');
  if(!accessToken)throw Error('먼저 휴대전화번호로 조회해 주세요.');
  if(!publicKey)throw Error('VAPID 공개키가 없습니다.');
  if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window))throw Error('이 브라우저는 웹 푸시를 지원하지 않습니다.');
  stage='② 알림 권한';report(stage+' 확인 중');
  const permission=await limit(Notification.requestPermission(),15000);
  if(permission!=='granted')throw Error('알림 권한이 허용되지 않았습니다: '+permission);
  stage='③ 서비스 워커 등록';report(stage+' 진행 중');
  const reg=await limit(navigator.serviceWorker.register('/sw.js'),15000);
  stage='④ 푸시 구독 생성';report(stage+' 진행 중');
  let sub=await limit(reg.pushManager.getSubscription(),10000);
  if(!sub)sub=await limit(reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64bytes(publicKey)}),20000);
  stage='⑤ 알림 서버 등록';report(stage+' 진행 중');
  const data=await limit(call('platform-send-push',{action:'subscribe',dojo_id:dojo,access_token:accessToken,subscription:sub.toJSON()}),20000);
  report('알림 등록이 완료됐습니다.');
 }catch(err){report(stage+' 실패: '+(err?.message||String(err)))}finally{btn.disabled=false}
};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script></body></html>
