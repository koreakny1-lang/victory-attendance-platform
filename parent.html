<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#082e61"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><title>태권도 출석관리 · 학부모</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f9;font-family:"Malgun Gothic",sans-serif;color:#172a40}main{max-width:540px;margin:32px auto;padding:0 15px}h1{text-align:center;color:#082e61;font-size:23px}p{line-height:1.6}.card{background:#fff;border-radius:15px;padding:22px;margin:16px 0;box-shadow:0 5px 24px #1c3e6312}label{display:block;margin:12px 0 8px;font-weight:bold}input{width:100%;padding:15px;font-size:18px;border:1px solid #c9d6e6;border-radius:9px}button{background:#082e61;color:#fff;border:0;border-radius:9px;padding:14px 18px;font-size:16px;cursor:pointer;width:100%;margin-top:12px}button:disabled{opacity:.5}.muted{color:#637589;font-size:13px}.student{border-top:1px solid #e0e8f1;padding:15px 0}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:10px 6px;border-bottom:1px solid #e6ecf3;text-align:center}img{width:100%;max-height:350px;object-fit:contain;border-radius:9px;background:#eef2f7}#msg,#pushMsg{min-height:24px;color:#174b83}.hide{display:none}.badge{font-weight:bold;color:#176045}</style></head><body><main><h1>태권도 출석관리</h1><p style="text-align:center" class="muted" id="intro">도장에서 안내받은 학부모 공용 주소입니다.</p><section class="card"><form id="form"><label for="phone">학부모 휴대전화번호</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="010-1234-5678" required><p class="muted">도장에 등록된 번호를 입력하세요. 출석번호는 학생이 출석체크기에 입력하는 번호입니다.</p><button id="lookup" type="submit">자녀 출석 확인</button></form><p id="msg" role="status"></p></section><section id="results" class="card hide"><h2 id="dojoName"></h2><div id="children"></div><button type="button" id="pushOn">이 휴대폰에서 출석·귀가 알림 켜기</button><p id="pushMsg" role="status"></p><p class="muted">휴대전화번호만으로 조회하는 간편 방식입니다. 번호를 아는 사람도 조회할 수 있으므로 공용 기기에서는 사용 후 입력 내용을 지워 주세요.</p></section></main><script>
const PROJECT='https://ixuxlblfkoccmwqxsjbw.supabase.co',KEY='sb_publishable_lmwJJaHfZzE5hXnZnF49oA__F7JpDZ8';const dojo=new URLSearchParams(location.search).get('dojo');const $=id=>document.getElementById(id);let accessToken=null,publicKey=null;
function fmt(v){return v?new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(v)):'—'}
async function call(name,payload){const res=await fetch(PROJECT+'/functions/v1/'+name,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify(payload)});const data=await res.json().catch(()=>({}));if(!res.ok||!data.success)throw Error(data.message||'서버 연결 오류');return data}
function render(data){$('dojoName').textContent=data.dojo_name||'우리 도장';$('children').replaceChildren();for(const child of data.children||[]){const sec=document.createElement('section');sec.className='student';const title=document.createElement('h3');title.textContent=child.name+' 학생';sec.append(title);const records=child.records||[];const recent=document.createElement('p');recent.className='badge';recent.textContent=records.length?'최근 출석 '+records[0].attendance_date+' '+fmt(records[0].checked_at)+' · 귀가 '+fmt(records[0].departed_at):'출석 기록 없음';sec.append(recent);if(child.photo_url){const pic=document.createElement('img');pic.src=child.photo_url;pic.alt=child.name+' 최근 출석사진';sec.append(pic)}const table=document.createElement('table');const thead=document.createElement('thead');thead.innerHTML='<tr><th>날짜</th><th>출석</th><th>귀가</th></tr>';table.append(thead);const tbody=document.createElement('tbody');for(const r of records){const tr=document.createElement('tr');for(const val of [r.attendance_date,fmt(r.checked_at),fmt(r.departed_at)]){const td=document.createElement('td');td.textContent=val;tr.append(td)}tbody.append(tr)}table.append(tbody);sec.append(table);$('children').append(sec)}$('results').classList.remove('hide')}
$('form').addEventListener('submit',async e=>{e.preventDefault();const phone=$('phone').value.replace(/\D/g,'');if(!/^01[016789][0-9]{7,8}$/.test(phone)){ $('msg').textContent='휴대전화번호를 확인해 주세요.';return}if(!/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(dojo||'')){$('msg').textContent='도장 공용 주소를 확인해 주세요.';return} $('lookup').disabled=true;$('msg').textContent='조회 중입니다.';try{const data=await call('platform-parent-phone',{dojo_id:dojo,phone});accessToken=data.access_token;publicKey=data.vapid_public_key;render(data);$('msg').textContent='조회되었습니다.';$('phone').value='';}catch(err){accessToken=null;$('results').classList.add('hide');$('msg').textContent=err.message||'조회 실패'}finally{$('lookup').disabled=false}});
function b64bytes(str){const pad='='.repeat((4-str.length%4)%4);const raw=atob((str+pad).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(raw,c=>c.charCodeAt(0))}
$('pushOn').onclick=async()=>{
 let stage='① 사전 확인';const btn=$('pushOn');btn.disabled=true;
 const report=t=>{$('pushMsg').textContent=t};
 const limit=(promise,ms)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(Error('응답 시간 초과 ('+Math.round(ms/1000)+'초)')),ms))]);
 try{
  report(stage+' 진행 중');
  if(!accessToken)throw Error('먼저 휴대전화번호로 조회해 주세요.');
  if(!publicKey)throw Error('VAPID 공개키가 없습니다.');
  if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window))throw Error('이 브라우저는 웹 푸시를 지원하지 않습니다.');
  stage='② 알림 권한';report(stage+' 확인 중');
  const permission=await limit(Notification.requestPermission(),15000);
  if(permission!=='granted')throw Error('알림 권한이 허용되지 않았습니다: '+permission);
  stage='③ 서비스 워커 등록';report(stage+' 진행 중');
  const reg=await limit(navigator.serviceWorker.register('/sw.js'),15000);
  stage='④ 푸시 구독 생성';report(stage+' 진행 중');
  let sub=await limit(reg.pushManager.getSubscription(),10000);
  if(!sub)sub=await limit(reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64bytes(publicKey)}),20000);
  stage='⑤ 알림 서버 등록';report(stage+' 진행 중');
  const data=await limit(call('platform-send-push',{action:'subscribe',dojo_id:dojo,access_token:accessToken,subscription:sub.toJSON()}),20000);
  report('알림 등록이 완료됐습니다.');
 }catch(err){report(stage+' 실패: '+(err?.message||String(err)))}finally{btn.disabled=false}
};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script></body></html>
