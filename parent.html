<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#082e61"><title>태권도 출석관리 · 학부모</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#163451;font-family:'Malgun Gothic',sans-serif}header{background:#082e61;color:#fff;padding:23px;text-align:center}main{max-width:580px;margin:20px auto;padding:0 15px}.card{background:#fff;border-radius:16px;padding:21px;margin:12px 0;box-shadow:0 4px 18px #102b4510}h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 12px}.muted{color:#60758a;font-size:13px}#photo{display:none;width:100%;max-width:350px;aspect-ratio:4/3;object-fit:cover;border-radius:12px;margin:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #e7edf3;padding:12px 4px;text-align:center}th{color:#506b86}button{border:0;border-radius:9px;padding:12px 16px;background:#1458a5;color:white;font-weight:700;cursor:pointer}</style></head><body><header><h1 id="dojo">태권도 출석관리</h1><p>우리 아이의 안전한 하루, 스마트한 출석관리</p></header><main><section class="card"><h2 id="student">자녀 출결 조회</h2><p id="status" role="status">정보를 불러오는 중입니다.</p><button id="refresh" type="button">새로고침</button></section><section class="card"><h2>최근 출석사진</h2><img id="photo" alt="학생의 최근 출석사진"><p id="noPhoto" class="muted">등록된 사진이 없습니다.</p></section><section class="card"><h2>최근 출결 기록</h2><table><thead><tr><th>날짜</th><th>출석</th><th>귀가</th></tr></thead><tbody id="records"></tbody></table><p class="muted">귀가 체크를 하지 않는 학생은 귀가 시간이 표시되지 않을 수 있습니다.</p></section></main><script>
const token=new URLSearchParams(location.search).get('t');const endpoint='https://ixuxlblfkoccmwqxsjbw.supabase.co/functions/v1/platform-parent-view';const pub='sb_publishable_lmwJJaHfZzE5hXnZnF49oA__F7JpDZ8';const el=id=>document.getElementById(id);const time=v=>v?new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(v)):'—';
async function load(){el('status').textContent='정보를 불러오는 중입니다.';el('refresh').disabled=true;try{if(!token)throw Error('학부모 전용 주소가 필요합니다.');const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json',apikey:pub,Authorization:'Bearer '+pub},body:JSON.stringify({token})});const data=await r.json();if(!r.ok)throw Error(data.message||'조회 실패');el('dojo').textContent=data.dojo;el('student').textContent=data.student+' 학생 출결';el('status').textContent='최근 출결 정보입니다.';el('photo').style.display=data.photo_url?'block':'none';el('noPhoto').style.display=data.photo_url?'none':'block';if(data.photo_url)el('photo').src=data.photo_url;el('records').replaceChildren();for(const rec of data.records){const tr=document.createElement('tr');for(const value of [rec.date,time(rec.checkin),time(rec.checkout)]){const td=document.createElement('td');td.textContent=value;tr.append(td)}el('records').append(tr)}if(!data.records.length)el('records').textContent='아직 출결 기록이 없습니다.';}catch(e){el('status').textContent=e.message}finally{el('refresh').disabled=false}}el('refresh').onclick=load;load();
</script></body></html>
