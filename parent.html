<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#082e61"><title>태권도 출석관리 · 학부모</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#173452;font-family:system-ui,'Malgun Gothic',sans-serif}header{background:#082e61;color:white;padding:25px 14px;text-align:center}h1{font-size:23px;margin:0}header p{font-size:13px;opacity:.85}main{max-width:540px;margin:20px auto;padding:0 14px}.card{background:white;border-radius:16px;padding:23px;margin:14px 0;box-shadow:0 3px 15px #16345510}h2{font-size:19px;margin:0 0 15px}label{display:block;font-size:14px;margin:13px 0 6px}input,button{width:100%;border-radius:10px;padding:15px;font-size:17px}input{border:1px solid #b7c9dd}button{background:#1455a2;border:0;color:#fff;font-weight:700;margin-top:14px;cursor:pointer}button:disabled{opacity:.55}.muted{font-size:13px;color:#5d7084;line-height:1.7}.hidden{display:none}#photo{max-width:100%;max-height:320px;object-fit:contain;border-radius:10px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:center;padding:10px 3px;border-bottom:1px solid #e4eaf1}#message{white-space:pre-wrap;line-height:1.6}#logout{background:#e8eef6;color:#24466c}</style></head><body><header><h1 id="dojoName">태권도 출석관리</h1><p>우리 아이의 안전한 하루, 스마트한 출석관리</p></header><main><section class="card" id="loginCard"><h2>학부모 출결 확인</h2><p class="muted" id="help">최초 접속 시 도장에 등록된 휴대전화번호와 자녀의 출석번호 4자리를 입력해 주세요.</p><form id="form"><div id="phoneBox"><label for="phone">학부모 휴대전화번호</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="01012345678" maxlength="15"></div><label for="pin">자녀 출석번호 4자리</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="off" placeholder="4자리 숫자"><button id="submit" type="submit">출결 확인</button></form><p id="message" role="status"></p><button id="logout" type="button" class="hidden">이 기기 연결 해제</button></section><section class="card hidden" id="result"><h2 id="studentName">자녀 출결</h2><p id="today"></p><h2>최근 출석사진</h2><img id="photo" class="hidden" alt="최근 출석사진"><p id="noPhoto" class="muted">사진이 없습니다.</p><h2>최근 출결 기록</h2><table><thead><tr><th>날짜</th><th>출석</th><th>귀가</th></tr></thead><tbody id="records"></tbody></table><button id="refresh" type="button">다시 확인</button></section></main><script>
const API='https://ixuxlblfkoccmwqxsjbw.supabase.co/functions/v1/platform-parent-access',KEY='sb_publishable_lmwJJaHfZzE5hXnZnF49oA__F7JpDZ8';const dojo=new URLSearchParams(location.search).get('dojo');const $=id=>document.getElementById(id);const storageKey='platform-parent-device-'+dojo;let token=localStorage.getItem(storageKey);function mode(){ $('phoneBox').classList.toggle('hidden',!!token);$('phone').required=!token;$('help').textContent=token?'연결된 기기입니다. 자녀 출석번호 4자리만 입력하세요.':'최초 접속 또는 새 기기에서는 등록된 학부모 휴대전화번호와 자녀 출석번호를 입력하세요.';$('logout').classList.toggle('hidden',!token)}mode();$('logout').onclick=()=>{localStorage.removeItem(storageKey);token=null;mode();$('result').classList.add('hidden');$('message').textContent='연결이 해제되었습니다.'};const fmt=v=>v?new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(v)):'—';
async function load(e){e?.preventDefault();const pin=$('pin').value;if(!/^[0-9]{4}$/.test(pin)){ $('message').textContent='출석번호 4자리를 입력해 주세요.';return}if(!/^[0-9a-f-]{36}$/i.test(dojo||'')){ $('message').textContent='도장 공용 주소가 올바르지 않습니다.';return}const phone=$('phone').value.replace(/\D/g,'');if(!token&&!/^01[016789][0-9]{7,8}$/.test(phone)){ $('message').textContent='도장에 등록된 휴대전화번호를 입력해 주세요.';return}const btn=$('submit');btn.disabled=true;$('message').textContent='확인 중입니다.';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify({dojo_id:dojo,pin,phone:token?undefined:phone,device_token:token||undefined})});const data=await r.json();if(!r.ok||!data.success)throw Error(data.message||'확인할 수 없습니다.');if(data.device_token){token=data.device_token;localStorage.setItem(storageKey,token);mode()}$('dojoName').textContent=data.dojo_name;$('studentName').textContent=data.student_name+' 학생';const rows=data.records||[];$('today').textContent=rows.length?'최근 출석: '+rows[0].attendance_date+' / '+fmt(rows[0].checked_at)+' / 귀가 '+fmt(rows[0].departed_at):'출석 기록이 없습니다.';$('records').replaceChildren();for(const rec of rows){const tr=document.createElement('tr');for(const val of [rec.attendance_date,fmt(rec.checked_at),fmt(rec.departed_at)]){const td=document.createElement('td');td.textContent=val;tr.append(td)}$('records').append(tr)}$('photo').classList.toggle('hidden',!data.photo_url);$('noPhoto').classList.toggle('hidden',!!data.photo_url);if(data.photo_url)$('photo').src=data.photo_url;else $('photo').removeAttribute('src');$('result').classList.remove('hidden');$('message').textContent='조회되었습니다.';$('pin').value=''}catch(err){$('result').classList.add('hidden');$('message').textContent=err.message||'조회 오류'}finally{btn.disabled=false}}$('form').addEventListener('submit',load);$('refresh').onclick=()=>{$('result').classList.add('hidden');$('message').textContent='출석번호를 다시 입력해 주세요.';$('pin').focus()};
</script></body></html>
