<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>승리 출석관리</title>
<style>
:root{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#182b45;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#082e61;color:white;padding:22px 16px;text-align:center}header h1{margin:0;font-size:22px}header p{margin:8px 0 0;color:#d9e5f6;font-size:13px}main{max-width:620px;margin:24px auto;padding:0 16px}.card{background:white;border-radius:17px;padding:22px;margin-bottom:15px;box-shadow:0 5px 22px #142e5012}h2{margin:0 0 16px;font-size:19px}label{display:block;font-size:13px;font-weight:bold;margin:14px 0 6px}input,select{width:100%;border:1px solid #ccd7e4;border-radius:10px;padding:13px;font-size:16px;background:#fff}button{border:0;background:#095bc7;color:white;border-radius:10px;padding:13px 16px;font-weight:700;cursor:pointer;font-size:15px}button:disabled{opacity:.55;cursor:wait}.full{width:100%;margin-top:15px}.alt{background:#e8f0fc;color:#103d75}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1}.muted{color:#65758a;font-size:13px;line-height:1.65}.message{white-space:pre-line;font-size:14px;line-height:1.6;margin-top:12px}.error{color:#b32222}.success{color:#126039}.hidden{display:none!important}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.list{display:grid;gap:8px}.dojo{width:100%;text-align:left;background:#edf4ff;color:#0d3e7b}.tag{font-size:12px;color:#687b94}.student{border-bottom:1px solid #edf0f5;padding:11px 0}.student:last-child{border-bottom:0}.note{background:#f1f5fc;border-radius:10px;padding:12px;font-size:13px;line-height:1.7}
</style>
</head>
<body>
<header><h1>🥋 승리 출석관리</h1><p>우리 아이의 안전한 하루, 스마트한 출석관리</p></header>
<main>
<section id="authCard" class="card"><h2>관리자 계정</h2><div class="tabs"><button id="loginTab" type="button">로그인</button><button id="signupTab" class="alt" type="button">회원가입</button></div>
<form id="authForm"><label for="email">이메일</label><input id="email" type="email" autocomplete="email" required><label for="password">비밀번호</label><input id="password" type="password" minlength="6" autocomplete="current-password" required><button id="authButton" class="full" type="submit">로그인</button></form>
<p class="muted" id="authHelp">기존 계정이 있다면 로그인해 주세요.</p><p id="authMessage" class="message" role="status"></p></section>
<section id="dashboard" class="hidden"><div class="card"><div class="row"><h2 style="margin:0">내 도장 관리</h2><button id="logout" class="alt" type="button">로그아웃</button></div><p id="signedIn" class="muted"></p><div id="dojoList" class="list"></div><p id="dashboardMessage" class="message" role="status"></p></div>
<div class="card"><h2>새 도장 개설</h2><p class="muted">현재는 테스트 단계입니다. 개설한 도장은 본인 계정에 연결됩니다.</p><form id="dojoForm"><label for="dojoName">도장 이름</label><input id="dojoName" minlength="2" maxlength="100" required placeholder="예: 용인대 승리태권도"><label for="dojoPhone">도장 연락처 (선택)</label><input id="dojoPhone" maxlength="40" type="tel" placeholder="010-0000-0000"><button id="dojoButton" class="full" type="submit">도장 개설하기</button></form><p id="dojoMessage" class="message" role="status"></p></div>
<div id="selectedCard" class="card hidden"><h2 id="selectedTitle">학생 관리</h2><p class="muted">현재 도장에 등록된 학생만 표시됩니다.</p><div id="studentsList"></div><h2 style="margin-top:22px">학생 등록</h2><form id="studentForm"><label for="studentName">학생 이름</label><input id="studentName" required maxlength="80"><label for="studentPin">출석번호 4자리</label><input id="studentPin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required placeholder="숫자 4자리"><button id="studentButton" class="full" type="submit">학생 등록하기</button></form><p id="studentMessage" class="message" role="status"></p><p class="note">출석체크·학부모 조회·사진·푸시 알림은 아직 통합 플랫폼에 연결되지 않았습니다. 기존 도장 시스템을 계속 사용해 주세요.</p></div>
</section>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const URL='https://ixuxlblfkoccmwqxsjbw.supabase.co';
const KEY='sb_publishable_lmwJJaHfZzE5hXnZnF49oA__F7JpDZ8';
const db=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
let mode='login',currentDojo=null,sessionUser=null;
function msg(id,text,error=false){const el=$(id);el.textContent=text;el.className='message '+(error?'error':'success')}
function setMode(next){mode=next;$('loginTab').className=mode==='login'?'':'alt';$('signupTab').className=mode==='signup'?'':'alt';$('authButton').textContent=mode==='login'?'로그인':'회원가입';$('authHelp').textContent=mode==='login'?'기존 계정이 있다면 로그인해 주세요.':'이메일 인증을 마친 뒤 로그인하여 도장을 개설하세요.';$('password').autocomplete=mode==='login'?'current-password':'new-password';msg('authMessage','')}
$('loginTab').onclick=()=>setMode('login');$('signupTab').onclick=()=>setMode('signup');
$('authForm').onsubmit=async e=>{e.preventDefault();const email=$('email').value.trim(),password=$('password').value;const btn=$('authButton');btn.disabled=true;msg('authMessage','처리 중...');try{if(mode==='signup'){const {data,error}=await db.auth.signUp({email,password,emailRedirectTo:location.origin+location.pathname});if(error)throw error;msg('authMessage',data.session?'가입 및 로그인 완료.':'가입 요청이 접수되었습니다. 이메일 인증 메일을 확인한 후 로그인하세요.');if(data.session)await refresh();}else{const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error;await refresh();}}catch(err){msg('authMessage',err.message||'로그인에 실패했습니다.',true)}finally{btn.disabled=false}};
$('logout').onclick=async()=>{await db.auth.signOut();currentDojo=null;await refresh()};
async function refresh(){const {data:{user},error}=await db.auth.getUser();sessionUser=error?null:user;$('authCard').classList.toggle('hidden',!!sessionUser);$('dashboard').classList.toggle('hidden',!sessionUser);if(!sessionUser)return;$('signedIn').textContent='로그인: '+sessionUser.email;await loadDojos()}
async function loadDojos(){const {data,error}=await db.from('platform_memberships').select('dojo_id,role,platform_dojos(id,name,phone,status)').eq('user_id',sessionUser.id);const list=$('dojoList');list.replaceChildren();if(error){msg('dashboardMessage','도장 조회 오류: '+error.message,true);return}msg('dashboardMessage',data.length?'도장을 선택하면 학생 관리 화면이 열립니다.':'등록된 도장이 없습니다. 아래에서 새 도장을 개설하세요.');for(const item of data){const d=item.platform_dojos;if(!d)continue;const btn=document.createElement('button');btn.className='dojo';btn.type='button';btn.textContent=d.name+' · '+({owner:'대표 관리자',manager:'관리자',staff:'관리자'}[item.role]||item.role);btn.onclick=()=>selectDojo(d);list.append(btn)}if(currentDojo){const matched=data.find(x=>x.dojo_id===currentDojo.id);if(matched)await selectDojo(matched.platform_dojos);else{$('selectedCard').classList.add('hidden');currentDojo=null}}}
$('dojoForm').onsubmit=async e=>{e.preventDefault();const btn=$('dojoButton');btn.disabled=true;msg('dojoMessage','개설 중...');try{const {data,error}=await db.rpc('platform_create_dojo',{p_name:$('dojoName').value.trim(),p_phone:$('dojoPhone').value.trim()||null});if(error)throw error;msg('dojoMessage','도장 개설이 완료됐습니다.');$('dojoForm').reset();currentDojo=null;await loadDojos();}catch(err){msg('dojoMessage','개설 실패: '+err.message,true)}finally{btn.disabled=false}};
async function selectDojo(dojo){currentDojo=dojo;$('selectedCard').classList.remove('hidden');$('selectedTitle').textContent=dojo.name+' · 학생 관리';msg('studentMessage','');await loadStudents()}
async function loadStudents(){if(!currentDojo)return;const {data,error}=await db.from('platform_students').select('id,name,pin,status').eq('dojo_id',currentDojo.id).order('created_at',{ascending:false});const box=$('studentsList');box.replaceChildren();if(error){msg('studentMessage','학생 조회 실패: '+error.message,true);return}if(!data.length){const p=document.createElement('p');p.className='muted';p.textContent='아직 등록된 학생이 없습니다.';box.append(p)}for(const s of data){const row=document.createElement('div');row.className='student';row.textContent=s.name+' · '+(s.status||'재원')+' · 출석번호 '+(s.pin||'미설정');box.append(row)}}
$('studentForm').onsubmit=async e=>{e.preventDefault();if(!currentDojo)return;const btn=$('studentButton');btn.disabled=true;msg('studentMessage','등록 중...');try{const pin=$('studentPin').value.trim();if(!/^\d{4}$/.test(pin))throw Error('출석번호는 숫자 4자리여야 합니다.');const {error}=await db.from('platform_students').insert({dojo_id:currentDojo.id,name:$('studentName').value.trim(),pin,status:'재원'});if(error)throw error;$('studentForm').reset();msg('studentMessage','학생이 등록되었습니다.');await loadStudents()}catch(err){msg('studentMessage','학생 등록 실패: '+err.message,true)}finally{btn.disabled=false}};
await refresh();
</script>
</body></html>
