<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>태권도 출석관리</title>
<style>
:root{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#182b45;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#082e61;color:white;padding:22px 16px;text-align:center}header h1{margin:0;font-size:22px}header p{margin:8px 0 0;color:#d9e5f6;font-size:13px}main{max-width:620px;margin:24px auto;padding:0 16px}.card{background:white;border-radius:17px;padding:22px;margin-bottom:15px;box-shadow:0 5px 22px #142e5012}h2{margin:0 0 16px;font-size:19px}label{display:block;font-size:13px;font-weight:bold;margin:14px 0 6px}input,select{width:100%;border:1px solid #ccd7e4;border-radius:10px;padding:13px;font-size:16px;background:#fff}button{border:0;background:#095bc7;color:white;border-radius:10px;padding:13px 16px;font-weight:700;cursor:pointer;font-size:15px}button:disabled{opacity:.55;cursor:wait}.full{width:100%;margin-top:15px}.alt{background:#e8f0fc;color:#103d75}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1}.muted{color:#65758a;font-size:13px;line-height:1.65}.message{white-space:pre-line;font-size:14px;line-height:1.6;margin-top:12px}.error{color:#b32222}.success{color:#126039}.hidden{display:none!important}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.list{display:grid;gap:8px}.dojo{width:100%;text-align:left;background:#edf4ff;color:#0d3e7b}.tag{font-size:12px;color:#687b94}.student{border-bottom:1px solid #edf0f5;padding:11px 0}.student:last-child{border-bottom:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:#f0f5fc;padding:13px 7px;text-align:center;border-radius:11px;font-size:12px}.stat strong{display:block;font-size:23px;margin-bottom:3px}.attendance-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;margin:14px 0}.attile{border:1px solid #dbe4ef;border-radius:12px;padding:12px;background:#f7f9fd;min-width:0}.attile.present{background:#e8f7ed;border-color:#a9dabc}.attile.departed{background:#e8f0ff;border-color:#b6c9ed}.attile strong{display:block;font-size:15px;overflow-wrap:anywhere}.attile small{display:block;color:#576b82;line-height:1.5;margin:6px 0}.tile-actions{display:flex;gap:5px;flex-wrap:wrap}.tile-actions button{padding:8px 10px;font-size:12px;flex:1}.tile-actions button:disabled{opacity:.5}.note{background:#f1f5fc;border-radius:10px;padding:12px;font-size:13px;line-height:1.7}
</style>
</head>
<body>
<header><h1>🥋 태권도 출석관리</h1><p>우리 아이의 안전한 하루, 스마트한 출석관리</p></header>
<main>
<section id="authCard" class="card"><h2>관리자 계정</h2><div class="tabs"><button id="loginTab" type="button">로그인</button><button id="signupTab" class="alt" type="button">회원가입</button></div>
<form id="authForm"><label for="username">아이디</label><input id="username" type="text" minlength="4" maxlength="20" pattern="[a-zA-Z0-9_]{4,20}" autocomplete="username" required placeholder="영문·숫자 4~20자"><label for="password">비밀번호</label><input id="password" type="password" minlength="8" maxlength="72" autocomplete="current-password" required><div id="signupFields" class="hidden"><label for="signupDojo">도장명</label><input id="signupDojo" minlength="2" maxlength="100" placeholder="예: 고려태권도"><label for="signupName">성함</label><input id="signupName" minlength="2" maxlength="50" placeholder="관리자 성함"><label for="signupPhone">전화번호</label><input id="signupPhone" type="tel" inputmode="tel" placeholder="010-1234-5678"></div><button id="authButton" class="full" type="submit">로그인</button></form>
<p class="muted" id="authHelp">기존 계정이 있다면 로그인해 주세요.</p><p id="authMessage" class="message" role="status"></p></section>
<section id="dashboard" class="hidden"><div class="card"><div class="row"><h2 style="margin:0">내 도장 관리</h2><button id="logout" class="alt" type="button">로그아웃</button></div><p id="signedIn" class="muted"></p><div id="dojoList" class="list"></div><p id="dashboardMessage" class="message" role="status"></p></div>
<div class="card hidden"><h2>새 도장 개설</h2><p class="muted">현재는 테스트 단계입니다. 개설한 도장은 본인 계정에 연결됩니다.</p><form id="dojoForm"><label for="dojoName">도장 이름</label><input id="dojoName" minlength="2" maxlength="100" required placeholder="예: 우리태권도"><label for="dojoPhone">도장 연락처 (선택)</label><input id="dojoPhone" maxlength="40" type="tel" placeholder="010-0000-0000"><button id="dojoButton" class="full" type="submit">도장 개설하기</button></form><p id="dojoMessage" class="message" role="status"></p></div>
<div id="selectedCard" class="card hidden"><h2 id="selectedTitle">학생 관리</h2>
<div class="row" style="margin:15px 0"><h2 style="margin:0">오늘 출석 현황</h2><button id="reloadAttendance" class="alt" type="button">새로고침</button></div>
<p id="attendanceDate" class="muted"></p>
<div class="stats"><div class="stat"><strong id="countAll">0</strong>전체</div><div class="stat"><strong id="countPresent">0</strong>출석</div><div class="stat"><strong id="countMissing">0</strong>미출석</div></div>
<div id="attendanceGrid" class="attendance-grid"></div><p id="attendanceMessage" class="message" role="status"></p>
<p class="muted">현재 도장에 등록된 학생만 표시됩니다.</p><div id="studentsList"></div><h2 style="margin-top:22px">학생 등록</h2><form id="studentForm"><label for="studentName">학생 이름</label><input id="studentName" required maxlength="80"><label for="studentPin">출석번호 4자리</label><input id="studentPin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required placeholder="숫자 4자리"><button id="studentButton" class="full" type="submit">학생 등록하기</button></form><p id="studentMessage" class="message" role="status"></p><p class="note">관리자 출석·귀가 기록과 오늘 출석 현황을 사용할 수 있습니다. 출석 사진·학부모 알림·학생용 번호 입력 출석체크는 아직 연결되지 않았습니다. 기존 도장 시스템을 계속 사용해 주세요.</p></div>
</section>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const URL='https://ixuxlblfkoccmwqxsjbw.supabase.co';
const KEY='sb_publishable_lmwJJaHfZzE5hXnZnF49oA__F7JpDZ8';
const db=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
let mode='login',currentDojo=null,sessionUser=null;
function msg(id,text,error=false){const el=$(id);el.textContent=text;el.className='message '+(error?'error':'success')}
function setMode(next){mode=next;$('loginTab').className=mode==='login'?'':'alt';$('signupTab').className=mode==='signup'?'':'alt';$('authButton').textContent=mode==='login'?'로그인':'회원가입';$('authHelp').textContent=mode==='login'?'가입한 아이디와 비밀번호로 로그인하세요.':'이메일 인증 없이 가입하면 도장이 자동으로 개설됩니다.';$('password').autocomplete=mode==='login'?'current-password':'new-password';$('signupFields').classList.toggle('hidden',mode!=='signup');for(const id of ['signupDojo','signupName','signupPhone'])$(id).required=mode==='signup';msg('authMessage','')}
$('loginTab').onclick=()=>setMode('login');$('signupTab').onclick=()=>setMode('signup');
$('authForm').onsubmit=async e=>{e.preventDefault();const username=$('username').value.trim().toLowerCase(),password=$('password').value;const btn=$('authButton');btn.disabled=true;msg('authMessage','처리 중...');try{const payload=mode==='signup'?{username,password,dojoName:$('signupDojo').value.trim(),fullName:$('signupName').value.trim(),phone:$('signupPhone').value.trim()}:{username,password};const res=await fetch(URL+'/functions/v1/'+(mode==='signup'?'platform-signup':'platform-login'),{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(payload)});const result=await res.json().catch(()=>({}));if(!res.ok||!result.success)throw Error(result.error||'요청에 실패했습니다.');if(mode==='signup'){setMode('login');$('username').value=username;$('password').value='';msg('authMessage','가입이 완료되었습니다. 설정한 아이디와 비밀번호로 로그인하세요.')}else{const {error}=await db.auth.setSession({access_token:result.access_token,refresh_token:result.refresh_token});if(error)throw error;await refresh()}}catch(err){msg('authMessage',err.message||'요청에 실패했습니다.',true)}finally{btn.disabled=false}};
$('logout').onclick=async()=>{await db.auth.signOut();currentDojo=null;await refresh()};
async function refresh(){const {data:{user},error}=await db.auth.getUser();sessionUser=error?null:user;$('authCard').classList.toggle('hidden',!!sessionUser);$('dashboard').classList.toggle('hidden',!sessionUser);if(!sessionUser)return;$('signedIn').textContent='관리자 로그인 완료';await loadDojos()}
async function loadDojos(){const {data,error}=await db.from('platform_memberships').select('dojo_id,role,platform_dojos(id,name,phone,status)').eq('user_id',sessionUser.id);const list=$('dojoList');list.replaceChildren();if(error){msg('dashboardMessage','도장 조회 오류: '+error.message,true);return}msg('dashboardMessage',data.length?'도장을 선택하면 학생 관리 화면이 열립니다.':'등록된 도장이 없습니다. 관리자에게 문의해 주세요.');for(const item of data){const d=item.platform_dojos;if(!d)continue;const btn=document.createElement('button');btn.className='dojo';btn.type='button';btn.textContent=d.name+' · '+({owner:'대표 관리자',manager:'관리자',staff:'관리자'}[item.role]||item.role);btn.onclick=()=>selectDojo(d);list.append(btn)}if(currentDojo){const matched=data.find(x=>x.dojo_id===currentDojo.id);if(matched)await selectDojo(matched.platform_dojos);else{$('selectedCard').classList.add('hidden');currentDojo=null}}}
$('dojoForm').onsubmit=async e=>{e.preventDefault();const btn=$('dojoButton');btn.disabled=true;msg('dojoMessage','개설 중...');try{const {data,error}=await db.rpc('platform_create_dojo',{p_name:$('dojoName').value.trim(),p_phone:$('dojoPhone').value.trim()||null});if(error)throw error;msg('dojoMessage','도장 개설이 완료됐습니다.');$('dojoForm').reset();currentDojo=null;await loadDojos();}catch(err){msg('dojoMessage','개설 실패: '+err.message,true)}finally{btn.disabled=false}};
async function selectDojo(dojo){currentDojo=dojo;$('selectedCard').classList.remove('hidden');$('selectedTitle').textContent=dojo.name+' · 학생 관리';msg('studentMessage','');await loadStudents();await loadAttendance()}
async function loadStudents(){if(!currentDojo)return;const {data,error}=await db.from('platform_students').select('id,name,pin,status').eq('dojo_id',currentDojo.id).order('created_at',{ascending:false});const box=$('studentsList');box.replaceChildren();if(error){msg('studentMessage','학생 조회 실패: '+error.message,true);return}if(!data.length){const p=document.createElement('p');p.className='muted';p.textContent='아직 등록된 학생이 없습니다.';box.append(p)}for(const s of data){const row=document.createElement('div');row.className='student';row.textContent=s.name+' · '+(s.status||'재원')+' · 출석번호 '+(s.pin||'미설정');box.append(row)}}
$('studentForm').onsubmit=async e=>{e.preventDefault();if(!currentDojo)return;const btn=$('studentButton');btn.disabled=true;msg('studentMessage','등록 중...');try{const pin=$('studentPin').value.trim();if(!/^\d{4}$/.test(pin))throw Error('출석번호는 숫자 4자리여야 합니다.');const {error}=await db.from('platform_students').insert({dojo_id:currentDojo.id,name:$('studentName').value.trim(),pin,status:'재원'});if(error)throw error;$('studentForm').reset();msg('studentMessage','학생이 등록되었습니다.');await loadStudents();await loadAttendance()}catch(err){msg('studentMessage','학생 등록 실패: '+err.message,true)}finally{btn.disabled=false}};

function todayKST(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function timeKST(v){return v?new Date(v).toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit'}):'-'}
let attendanceBusy=false;
async function loadAttendance(){
 if(!currentDojo)return;
 const dojoId=currentDojo.id, day=todayKST();
 $('attendanceDate').textContent=day+' · 한국 시간 기준';
 const grid=$('attendanceGrid');grid.replaceChildren();msg('attendanceMessage','출석 현황을 불러오는 중...');
 const [sr,ar]=await Promise.all([
   db.from('platform_students').select('id,name,pin,status').eq('dojo_id',dojoId).order('name'),
   db.from('platform_attendance').select('id,student_id,checked_at,departed_at').eq('dojo_id',dojoId).eq('attendance_date',day)
 ]);
 if(currentDojo?.id!==dojoId)return;
 if(sr.error||ar.error){msg('attendanceMessage','조회 실패: '+(sr.error?.message||ar.error?.message),true);return}
 const students=(sr.data||[]).filter(x=>x.status==='재원');
 const records=new Map((ar.data||[]).map(x=>[x.student_id,x]));
 const present=students.filter(x=>records.has(x.id)).length;
 $('countAll').textContent=students.length;$('countPresent').textContent=present;$('countMissing').textContent=students.length-present;
 if(!students.length){msg('attendanceMessage','등록된 재원생이 없습니다.');return}
 msg('attendanceMessage','학생별 버튼으로 출석 또는 귀가를 기록할 수 있습니다.');
 for(const st of students){
  const rec=records.get(st.id),tile=document.createElement('div');
  tile.className='attile'+(rec?(rec.departed_at?' departed':' present'):'');
  const title=document.createElement('strong');title.textContent=st.name;
  const info=document.createElement('small');info.textContent=rec?(rec.departed_at?'귀가 완료':'출석 완료')+' · '+timeKST(rec.checked_at)+(rec.departed_at?' / '+timeKST(rec.departed_at):''):'미출석';
  const actions=document.createElement('div');actions.className='tile-actions';
  const btn=document.createElement('button');btn.type='button';btn.textContent=!rec?'출석 체크':(!rec.departed_at?'귀가 체크':'완료');btn.disabled=!!rec?.departed_at;
  btn.onclick=()=>markAttendance(st,rec,day,dojoId);
  actions.append(btn);tile.append(title,info,actions);grid.append(tile);
 }
}
async function markAttendance(student,record,day,dojoId){
 if(attendanceBusy||currentDojo?.id!==dojoId)return;
 if(!confirm(student.name+' 학생 '+(record?'귀가':'출석')+' 처리하시겠습니까?'))return;
 attendanceBusy=true;msg('attendanceMessage','기록 중...');
 try{
  let result;
  if(!record){result=await db.from('platform_attendance').insert({dojo_id:dojoId,student_id:student.id,attendance_date:day});}
  else{result=await db.from('platform_attendance').update({departed_at:new Date().toISOString()}).eq('id',record.id).eq('dojo_id',dojoId).is('departed_at',null).select('id');if(!result.error&&(!result.data||!result.data.length))throw Error('이미 귀가 처리되었습니다.');}
  if(result.error)throw result.error;
  await loadAttendance();
 }catch(e){await loadAttendance();msg('attendanceMessage','처리 실패: '+(e.message||'잠시 후 다시 시도하세요.'),true)}
 finally{attendanceBusy=false}
}
$('reloadAttendance').onclick=()=>loadAttendance();

await refresh();
</script>
</body></html>
