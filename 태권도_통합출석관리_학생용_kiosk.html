<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#082e61"><title>태권도 출석체크기</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3fa;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#19324f}.wrap{max-width:490px;margin:0 auto;padding:26px 18px}header{text-align:center;padding:24px 0 18px}h1{font-size:25px;margin:0 0 12px}header p{color:#61738b;margin:0;font-size:14px}.panel{background:#fff;border-radius:22px;padding:28px 23px;box-shadow:0 9px 35px #0a315114}#dojoName{text-align:center;font-weight:800;font-size:21px;margin:0 0 18px}.dots{display:flex;justify-content:center;gap:16px;margin:24px 0}.dot{width:20px;height:20px;border-radius:50%;border:2px solid #b7c8dc;background:white}.dot.on{background:#0a59bc;border-color:#0a59bc}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.keys button{height:76px;border:1px solid #dce5f1;border-radius:15px;background:#f8faff;color:#153d71;font-size:30px;font-weight:800;cursor:pointer;touch-action:manipulation}.keys button:active{background:#d8e8ff}.keys button.special{font-size:17px;background:#e9f1fb}.message{text-align:center;min-height:64px;padding:17px 6px 3px;font-size:17px;font-weight:700;line-height:1.6}.ok{color:#13804c}.error{color:#ba3434}.muted{font-size:13px;color:#6d7d91;text-align:center;line-height:1.7}button:disabled{opacity:.5}#submit{width:100%;padding:16px;border:0;border-radius:13px;background:#0a59bc;color:#fff;font-size:18px;font-weight:800;margin-top:14px;cursor:pointer}#submit:disabled{background:#a5b7d1}#pinInput{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}@media(max-width:390px){.keys button{height:65px}}
</style></head><body><div class="wrap"><header><h1>태권도 출석체크</h1><p>번호를 입력하면 출석 또는 귀가가 기록됩니다.</p></header><section class="panel"><div id="dojoName">학생 출석체크기</div><div class="dots" aria-label="출석번호 입력 상태"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><input id="pinInput" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="출석번호"><div class="keys" id="keys"></div><button id="submit" disabled>확인</button><div id="message" class="message" role="status"></div></section><p class="muted">첫 입력은 출석 · 5분 이후 재입력은 귀가<br>이미 귀가한 학생은 중복 처리되지 않습니다.</p></div><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://ixuxlblfkoccmwqxsjbw.supabase.co','sb_publishable_lmwJJaHfZzE5hXnZnF49oA__F7JpDZ8');
const token=new URLSearchParams(location.search).get('k')||'';
const $=id=>document.getElementById(id);let pin='',busy=false,timer=null;
function render(){document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i<pin.length));$('submit').disabled=busy||pin.length!==4}
function message(t,ok){$('message').textContent=t;$('message').className='message '+(ok?'ok':'error')}
function digit(v){if(busy)return;if(v==='del')pin=pin.slice(0,-1);else if(v==='clear')pin='';else if(pin.length<4)pin+=v;message('',true);render();if(pin.length===4)submit()}
for(const v of ['1','2','3','4','5','6','7','8','9','clear','0','del']){const b=document.createElement('button');b.type='button';b.textContent=v==='clear'?'전체 삭제':v==='del'?'←':v;b.className=/clear|del/.test(v)?'special':'';b.onclick=()=>digit(v);$('keys').append(b)}
async function submit(){if(busy||pin.length!==4||!token)return;busy=true;render();message('확인 중입니다...',true);try{const {data,error}=await db.rpc('platform_kiosk_check',{p_token:token,p_pin:pin});if(error)throw error;message(data?.success?(data.name+' 학생 '+data.message):(data?.message||'처리하지 못했습니다.'),!!data?.success)}catch(e){message('연결 오류입니다. 잠시 후 다시 시도해 주세요.',false)}finally{pin='';busy=false;render();clearTimeout(timer);timer=setTimeout(()=>message('',true),6000)}}
$('submit').onclick=submit;document.addEventListener('keydown',e=>{if(e.key>='0'&&e.key<='9')digit(e.key);else if(e.key==='Backspace')digit('del');else if(e.key==='Escape')digit('clear');else if(e.key==='Enter')submit()});
if(!/^[0-9a-f-]{36}$/i.test(token)){message('관리자에게 출석체크기 주소를 요청해 주세요.',false);document.querySelectorAll('.keys button').forEach(b=>b.disabled=true)}
</script></body></html>
