<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>태권도 출석체크</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3fa;font-family:'Malgun Gothic',sans-serif;color:#173451}.wrap{max-width:470px;margin:25px auto;padding:16px;text-align:center}.card{background:white;padding:24px;border-radius:20px;box-shadow:0 6px 28px #17345118}h1{font-size:24px}#cameraBox{display:none;position:relative;margin:0 auto 16px;max-width:350px;background:#111;border-radius:16px;overflow:hidden}video{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:center;transform:scaleX(-1);display:block}#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:900;color:white;text-shadow:0 4px 18px #000}#dots{letter-spacing:15px;font-size:30px;color:#0b56ad;min-height:45px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.keys button{height:68px;font-size:28px;font-weight:bold;border:1px solid #dce4ee;background:#f7faff;border-radius:13px;color:#143d70}.keys .special{font-size:15px}#status{min-height:75px;padding:16px 0;font-size:17px;font-weight:bold;line-height:1.6}small{color:#687c90}button:disabled{opacity:.4}</style></head><body><main class="wrap"><h1>태권도 출석체크</h1><p>번호 입력 후 3 · 2 · 1 자동 촬영</p><section class="card"><div id="cameraBox"><video id="video" autoplay muted playsinline></video><div id="count"></div></div><div id="dots">○ ○ ○ ○</div><div class="keys" id="keys"></div><div id="status" role="status">출석번호 4자리를 입력해 주세요.</div><small>첫 입력 출석 · 5분 후 귀가 가능<br>사진 촬영을 위해 카메라 권한을 허용해 주세요.</small></section></main><script>
const key=new URLSearchParams(location.search).get('k');const box=document.getElementById('cameraBox'),vid=document.getElementById('video'),count=document.getElementById('count'),dots=document.getElementById('dots'),status=document.getElementById('status');let pin='',busy=false,stream=null;const endpoint='https://ixuxlblfkoccmwqxsjbw.supabase.co/functions/v1/platform-kiosk-photo';const pub='sb_publishable_lmwJJaHfZzE5hXnZnF49oA__F7JpDZ8';
function say(t){status.textContent=t}function draw(){dots.textContent='● '.repeat(pin.length)+'○ '.repeat(4-pin.length);document.querySelectorAll('#keys button').forEach(b=>b.disabled=busy)}function reset(){pin='';busy=false;draw();box.style.display='none';count.textContent='';if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}function digit(v){if(busy)return;if(v==='clear')pin='';else if(v==='del')pin=pin.slice(0,-1);else if(pin.length<4)pin+=v;draw();if(pin.length===4)go()}
for(const v of ['1','2','3','4','5','6','7','8','9','clear','0','del']){let b=document.createElement('button');b.type='button';b.textContent=v==='clear'?'전체 삭제':v==='del'?'←':v;b.className=isNaN(Number(v))?'special':'';b.onclick=()=>digit(v);document.getElementById('keys').append(b)}
async function go(){if(!/^[0-9a-f-]{36}$/i.test(key||'')){say('올바른 도장 출석체크기 주소가 아닙니다.');reset();return}busy=true;draw();let image=null;try{say('카메라 준비 중...');if(!navigator.mediaDevices?.getUserMedia)throw Error('카메라를 사용할 수 없는 환경입니다.');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:720},height:{ideal:720}}});vid.srcObject=stream;box.style.display='block';await vid.play();if(!vid.videoWidth)await sleep(400);for(let n=3;n>=1;n--){count.textContent=n;say(n+'초 후 자동 촬영');await sleep(1000)}count.textContent='';const canvas=document.createElement('canvas');canvas.width=600;canvas.height=600;const ctx=canvas.getContext('2d');const vw=vid.videoWidth,vh=vid.videoHeight;if(!vw||!vh)throw Error('카메라 영상이 준비되지 않았습니다.');const side=Math.min(vw,vh),sx=(vw-side)/2,sy=(vh-side)/2;ctx.translate(canvas.width,0);ctx.scale(-1,1);ctx.drawImage(vid,sx,sy,side,side,0,0,canvas.width,canvas.height);image=canvas.toDataURL('image/jpeg',0.7);stream.getTracks().forEach(t=>t.stop());stream=null;box.style.display='none';say('출결 기록 중...');const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','apikey':pub,'Authorization':'Bearer '+pub},body:JSON.stringify({kiosk_token:key,pin,photo:image})});const result=await response.json();say(result.message||'처리 결과를 확인할 수 없습니다.');if(!response.ok)throw Error(result.message||'서버 오류');if(result.success)say((result.name||'학생')+' · '+result.message);}
catch(e){say(e.message||'오류가 발생했습니다.');}finally{pin='';draw();await sleep(3500);reset();say('출석번호 4자리를 입력해 주세요.')}}
document.addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key))digit(e.key);else if(e.key==='Backspace')digit('del');else if(e.key==='Escape')digit('clear')});if(!key)say('관리자에게 도장 전용 주소를 요청해 주세요.');
</script></body></html>
