<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142e60"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><title>승리태권도 관리자 모드</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,'Malgun Gothic',sans-serif;background:#f4f6fa;color:#142e60}header{height:46px;background:#142e60;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:14px;font-weight:bold}header button{border:1px solid #ffffff88;background:transparent;color:white;border-radius:6px;padding:5px 9px}iframe{width:100%;height:calc(100dvh - 46px);border:0;background:white}#setup{max-width:540px;margin:12vh auto;background:white;padding:24px;border-radius:15px;box-shadow:0 6px 25px #142e6022}input{width:100%;padding:13px;border:1px solid #b6c6dc;border-radius:9px;font-size:15px;margin:12px 0}#save{background:#142e60;color:#fff;border:0;padding:13px;border-radius:9px;width:100%;font-size:15px}p{line-height:1.65;font-size:14px}#error{color:#ae3030}</style></head><body><header><span>승리태권도 관리자 모드</span><button id="change" type="button">주소 설정</button></header><div id="setup" hidden><h2>관리자 모드 연결</h2><p>관리자 화면의 주소 관리에서 <b>관리자 화면</b>를 복사하여 입력하세요. 최초 1회만 설정하면 됩니다.</p><input id="url" type="url" placeholder="https://checkcheck-tkd.vercel.app/index.html"><button id="save">연결하고 열기</button><p id="error"></p></div><iframe id="view" title="관리자 모드" allow="camera; microphone; fullscreen" referrerpolicy="same-origin" hidden></iframe><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');const key='victory_pwa_admin_url',fallback='/',frame=document.getElementById('view'),setup=document.getElementById('setup'),input=document.getElementById('url');function valid(v){try{let u=new URL(v,location.origin);if(u.origin!==location.origin)throw Error('같은 출석관리 사이트 주소만 사용할 수 있습니다.');if(!u.pathname.endsWith('index.html') && u.pathname!=='/')throw Error('올바른 관리자 모드 주소를 입력하세요.');return u.href}catch(e){document.getElementById('error').textContent=e.message;return null}}function show(v){if(v){frame.src=v;frame.hidden=false;setup.hidden=true}else{frame.hidden=true;setup.hidden=false;input.value=localStorage.getItem(key)||fallback}}document.getElementById('change').onclick=()=>show(null);document.getElementById('save').onclick=()=>{let v=valid(input.value.trim());if(v){localStorage.setItem(key,v);show(v)}};show(localStorage.getItem(key)||fallback);</script></body></html>
